<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Localleadster">
  <defs>
    <linearGradient id="g" x1="80" y1="60" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Soft squircle: opaque edge-to-edge (no circular clip → no transparent “wings” on hosts that mask to a circle). -->
    <clipPath id="sq">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#g)"/>

  <g clip-path="url(#sq)">
    <g transform="translate(256, 258) scale(0.72) translate(-256, -258)">
      <path
        d="M256 128c-76 0-132 56-132 132 0 114 132 248 132 248s132-134 132-248c0-76-56-132-132-132Z"
        fill="#ffffff"
        fill-opacity="0.96"
      />
      <circle cx="256" cy="260" r="74" fill="url(#g)"/>
      <circle cx="256" cy="260" r="40" fill="#ffffff" fill-opacity="0.96"/>
    </g>
  </g>
</svg>
